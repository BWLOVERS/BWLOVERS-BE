spring:
  datasource:
    url: jdbc:h2:mem:bwlovers-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      client:
        registration:
          naver:
            client-id: test-client-id
            client-secret: test-client-secret
            scope:
              - name
              - email
              - profile_image
              - mobile
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8080/auth/redirect/naver
            client-authentication-method: client_secret_post
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

oauth2:
  redirect:
    success-url: http://localhost:3000/auth/callback
    failure-url: http://localhost:3000/auth/callback

jwt:
  secret: test-test-test-test-test-test-test-test
  access-token-expire-ms: 3600000
  refresh-token-expire-ms: 1209600000

ai:
  server:
    url: http://localhost:8000

analysis:
  ocr:
    job-ttl-seconds: 1800
    max-pages: 10
    max-file-size-bytes: 10485760
    s3:
      prefix: tmp/ocr
    clova:
      invoke-url: http://localhost:9000/mock-clova
      secret: test-clova-secret

cloud:
  aws:
    region: ap-northeast-2
    s3:
      bucket: test-bucket

openai:
  api-key: test-openai-key
  model: gpt-4.1-mini
