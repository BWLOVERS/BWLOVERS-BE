plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.3'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.bwlovers'
version = '0.0.1-SNAPSHOT'
description = 'BWLOVERS backend service'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
    // Web / JSON
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    // Security
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    // JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'
    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'com.h2database:h2'

    implementation 'io.netty:netty-resolver-dns-native-macos:4.1.100.Final:osx-aarch_64'
    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // JSON 직렬화용
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // S3
    implementation 'software.amazon.awssdk:s3:2.25.52'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('incidentDiagnosis', JavaExec) {
    group = 'application'
    description = 'Analyzes incident JSON and optionally sends a diagnosis to Discord without starting Spring.'
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.capstone.bwlovers.ops.incident.IncidentDiagnosisCli'
}

def loadTestProperties = [
        'loadTestUrl',
        'loadTestMethod',
        'loadTestConcurrentUsers',
        'loadTestTotalRequests',
        'loadTestBodyFile',
        'loadTestHeadersFile',
        'loadTestContentType',
        'loadTestAuthToken',
        'loadTestConnectTimeoutMs',
        'loadTestRequestTimeoutMs',
        'loadTestClassifierField',
        'loadTestConfirmedValues',
        'loadTestWaitingValues',
        'loadTestDuplicateValues',
        'loadTestConfirmedStatuses',
        'loadTestWaitingStatuses',
        'loadTestDuplicateStatuses',
        'loadTestConfirmedPatterns',
        'loadTestWaitingPatterns',
        'loadTestDuplicatePatterns'
]

tasks.register('registrationLoadTest', JavaExec) {
    group = 'verification'
    description = 'Runs the terminal registration load test reporter.'
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.capstone.bwlovers.loadtest.RegistrationLoadTestRunner'

    loadTestProperties.each { propertyName ->
        def value = project.findProperty(propertyName) ?: System.getProperty(propertyName)
        if (value != null && !value.toString().isBlank()) {
            systemProperty propertyName, value.toString()
        }
    }
}
