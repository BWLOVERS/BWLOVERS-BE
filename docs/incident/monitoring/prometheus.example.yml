global:
  scrape_interval: 15s
  evaluation_interval: 1m

scrape_configs:
  - job_name: bwlovers
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      # Replace with an absolute path to a file containing INCIDENT_METRICS_TOKEN.
      credentials_file: /absolute/path/to/incident-metrics-token
    static_configs:
      # Must be the same instance label sent in the Grafana alert.
      - targets: ['localhost:8080']
