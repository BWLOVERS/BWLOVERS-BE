# Grafana-managed alerts. Copy into Grafana's provisioning/alerting directory.
# Add a Webhook contact point and a notification policy matching team=incident.
apiVersion: 1
groups:
  - orgId: 1
    name: Incident diagnostics
    folder: Incidents
    interval: 1m
    rules:
      - uid: incident-heap
        title: HIGH_JVM_HEAP
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          team: incident
        annotations:
          summary: 'HIGH_JVM_HEAP - inspect metrics before changing configuration'
        data:
          - refId: A
            datasourceUid: incident-prometheus
            relativeTimeRange: {from: 300, to: 0}
            model:
              refId: A
              expr: '100 * sum by(job,instance)(jvm_memory_used_bytes{job="bwlovers",area="heap"} and on(job,instance,id) (jvm_memory_max_bytes{job="bwlovers",area="heap"} > 0)) / sum by(job,instance)(jvm_memory_max_bytes{job="bwlovers",area="heap"} > 0)'
              instant: true
              range: false
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [85]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last, params: []}
                  type: query
      - uid: incident-latency
        title: HIGH_REQUEST_LATENCY
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          team: incident
        annotations:
          summary: 'HIGH_REQUEST_LATENCY - inspect metrics before changing configuration'
        data:
          - refId: A
            datasourceUid: incident-prometheus
            relativeTimeRange: {from: 300, to: 0}
            model:
              refId: A
              expr: 'histogram_quantile(0.95, sum by(job,instance,le)(rate(http_server_requests_seconds_bucket{job="bwlovers",uri!~"/actuator/.*|/internal/.*"}[5m])))'
              instant: true
              range: false
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0.8]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last, params: []}
                  type: query
      - uid: incident-429
        title: HTTP_429
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          team: incident
        annotations:
          summary: 'HTTP_429 - inspect metrics before changing configuration'
        data:
          - refId: A
            datasourceUid: incident-prometheus
            relativeTimeRange: {from: 300, to: 0}
            model:
              refId: A
              expr: 'sum by(job,instance)(increase(http_server_requests_seconds_count{job="bwlovers",status="429",uri!~"/actuator/.*|/internal/.*"}[5m]))'
              instant: true
              range: false
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last, params: []}
                  type: query
      - uid: incident-db
        title: HIGH_DB_POOL
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          team: incident
        annotations:
          summary: 'HIGH_DB_POOL - inspect metrics before changing configuration'
        data:
          - refId: A
            datasourceUid: incident-prometheus
            relativeTimeRange: {from: 300, to: 0}
            model:
              refId: A
              expr: '100 * hikaricp_connections_active{job="bwlovers"} / hikaricp_connections_max{job="bwlovers"}'
              instant: true
              range: false
              intervalMs: 15000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [80]}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {type: last, params: []}
                  type: query
